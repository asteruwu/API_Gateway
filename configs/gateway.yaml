gateway:
  port: "6666"
  plugins:
    tcp:
      tcp_limit:
        max_conn: 100
    http:
      auth:
        credentials:
          - bearer
        jwt:
          secret_env: GATEWAY_JWT_SECRET
          issuer: https://idp.example.com
          audience: gateway
          leeway: 30s
      rate_limit:
        limiters:
          - route
    transformer:
      testT: {}
  tcp_filters:
    enabled:
      - tcp_limit
  http_filters:
    enabled:
      - auth
      - rate_limit
  decoder:
    max_body: 4096
  encoder: {}
  transformer:
    enabled:
      - testT
  pool:
    max_conn: 64
    min_idle: 4
    dial_timeout: 3s
    borrow_timeout: 10s
    idle_timeout: 60s
    wait_timeout: 5s
